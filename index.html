    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {

        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg); ze: 24px; line-height: 1.15; letter-spacing: 0.005em; margin: 0;\">What it is ≠ how it is perceived.<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0; color: var(--color-neutral-800);\">Wine evolves in storage, transport and time – the label and the expectation do not. That gap is where good wine gets poured away.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 16px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 13px; font-weight: 600; font-feature-settings: 'tnum' 1; color: var(--color-accent-700);\">02 · The grip<\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px; line-height: 1.15; letter-spacing: 0.005em; margin: 0;\">Both perspectives, carried at once.<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0; color: var(--color-neutral-800);\">The analytical – what can I find? – and the analogical – what awakens in me? Not two stages: one double grip, where the question decides the angle.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-text); padding-top: 16px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 13px; font-weight: 600; font-feature-settings: 'tnum' 1; color: var(--color-accent-700);\">03 · The craft<\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px; line-height: 1.15; letter-spacing: 0.005em; margin: 0;\">What could this become?<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0; color: var(--color-neutral-800);\">Abduction as techne – the trained judgement that turns what already exists into its best next form. Every element below is that nucleus, in a different shape.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider);\">\n\n  <section aria-label=\"By the numbers\" style=\"padding: 56px 0;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 40px 32px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(36px, 3.6vw, 52px); line-height: 1; color: var(--color-accent); letter-spacing: 0.005em;\">20+<\u002Fspan>\n        <span style=\"font-size: 13px; line-height: 18px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-neutral-700);\">Years of continuous research<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(36px, 3.6vw, 52px); line-height: 1; color: var(--color-accent); letter-spacing: 0.005em;\">9<\u002Fspan>\n        <span style=\"font-size: 13px; line-height: 18px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-neutral-700);\">Peer-reviewed publications<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(36px, 3.6vw, 52px); line-height: 1; color: var(--color-accent); letter-spacing: 0.005em;\">95%<\u002Fspan>\n        <span style=\"font-size: 13px; line-height: 18px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-neutral-700);\">Of consumers open to a blended rescued wine<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(36px, 3.6vw, 52px); line-height: 1; color: var(--color-accent); letter-spacing: 0.005em;\">500M<\u002Fspan>\n        <span style=\"font-size: 13px; line-height: 18px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-neutral-700);\">Bottles’ worth of wine discarded every year<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size: 12px; line-height: 18px; color: var(--color-neutral-700); margin: 32px 0 0;\">Sources: Crichton-Fock et al., Frontiers in Psychology 2023 (n=329); Upcycled By; Strange Estate.<\u002Fp>\n  <\u002Fsection>\n\n  <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider);\">\n\n  <section id=\"founder\" style=\"padding: 56px 0 64px; scroll-margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 32px 56px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0;\">\n      <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700);\">The founder<\u002Fspan>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.06; letter-spacing: 0.005em; margin: 0;\">Anders Crichton-Fock, PhD<\u002Fh2>\n      <span style=\"font-size: 15px; line-height: 22px; font-weight: 600;\">Senior Lecturer · School of Hospitality, Culinary Arts &amp; Meal Science, Örebro University<\u002Fspan>\n      <p style=\"font-size: 17px; line-height: 28px; margin: 0; max-width: 54ch;\">One leg in academia, one in industry. Twenty years as CEO, marketing director and purchasing manager in the wine and food trade – and research into tacit knowledge, sommellerie and how analytical and analogical approaches combine. He teaches tasting methodology, multisensory analysis and the philosophy of science.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n        <a class=\"btn btn-secondary\" href=\"https://www.oru.se/english/employee/anders_crichton-fock\" target=\"_blank\" rel=\"noopener\">Örebro University profile<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"http://orcid.org/0000-0003-3762-483X\" target=\"_blank\" rel=\"noopener\">ORCID<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <dl style=\"margin: 0; display: flex; flex-direction: column; min-width: 0;\">\n      <div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; border-top: 2px solid var(--color-text); padding: 12px 0;\"><dt style=\"font-weight: 800; font-feature-settings: 'tnum' 1;\">Late 90s<\u002Fdt><dd style=\"margin: 0; font-size: 15px; line-height: 22px;\">One of the first two doctoral students in Meal Science, Campus Grythyttan<\u002Fdd><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; border-top: 2px solid var(--color-divider); padding: 12px 0;\"><dt style=\"font-weight: 800; font-feature-settings: 'tnum' 1;\">2004<\u002Fdt><dd style=\"margin: 0; font-size: 15px; line-height: 22px;\">Licentiate, KTH &amp; Örebro: <em>The aesthetics of the sensory experience – the wine taster in the borderland between art and science<\u002Fem><\u002Fdd><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; border-top: 2px solid var(--color-divider); padding: 12px 0;\"><dt style=\"font-weight: 800; font-feature-settings: 'tnum' 1;\">2011<\u002Fdt><dd style=\"margin: 0; font-size: 15px; line-height: 22px;\">Doctorate, KTH: <em>The working palate – the wine taster’s double grip, from analysis to experience<\u002Fem><\u002Fdd><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; border-top: 2px solid var(--color-divider); padding: 12px 0;\"><dt style=\"font-weight: 800; font-feature-settings: 'tnum' 1;\">2015<\u002Fdt><dd style=\"margin: 0; font-size: 15px; line-height: 22px;\">Returns to Örebro University after 20 years in industry; later visiting assistant professor at Washington State University<\u002Fdd><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; border-top: 2px solid var(--color-divider); padding: 12px 0;\"><dt style=\"font-weight: 800; font-feature-settings: 'tnum' 1;\">2019–<\u002Fdt><dd style=\"margin: 0; font-size: 15px; line-height: 22px;\">Member of the Faculty Board, Business, Science &amp; Engineering<\u002Fdd><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; border-top: 2px solid var(--color-divider); padding: 12px 0;\"><dt style=\"font-weight: 800; font-feature-settings: 'tnum' 1;\">2021<\u002Fdt><dd style=\"margin: 0; font-size: 15px; line-height: 22px;\">Founds Rewine The World®<\u002Fdd><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider); padding: 12px 0;\"><dt style=\"font-weight: 800; font-feature-settings: 'tnum' 1; color: var(--color-accent-700);\">2024<\u002Fdt><dd style=\"margin: 0; font-size: 15px; line-height: 22px;\">Innovator of the Year, Almi Mälardalen<\u002Fdd><\u002Fdiv>\n    <\u002Fdl>\n  <\u002Fsection>\n\n  <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider);\">\n\n  <section id=\"companies\" style=\"padding: 56px 0 72px; scroll-margin-top: 16px;\">\n    <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700); margin-bottom: 24px;\">The companies<\u002Fspan>\n    <div style=\"display: grid; grid-template-columns: minmax(56px, 120px) minmax(0, 380px) minmax(0, 1fr); gap: 16px clamp(20px, 4vw, 64px); align-items: baseline; padding: 32px 0; border-top: 2px solid var(--color-divider);\">\n      <span aria-hidden=\"true\" style=\"width: clamp(56px, 6vw, 80px); aspect-ratio: 1 / 1; align-self: start; background: var(--color-accent); color: var(--color-bg); border: 2px solid var(--color-accent); padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;\"><span style=\"font-size: 11px; font-weight: 600; line-height: 1; font-feature-settings: 'tnum' 1;\">3<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 2.6vw, 34px); line-height: 1;\">Gc<\u002Fspan><\u002Fspan>\n      <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: 0.005em; margin: 0;\">Grythyttan Culinary Science<\u002Fh3>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0; max-width: 56ch; color: var(--color-neutral-800);\">Applies research and develops innovation in culinary science, focused on reusing and upcycling complex foods with a high climate footprint – such as wine. Art and science are the tools.<\u002Fp>\n        <a class=\"btn btn-ghost\" href=\"https://culinaryscience.se/\" target=\"_blank\" rel=\"noopener\" style=\"padding-inline: 0;\">culinaryscience.se<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: minmax(56px, 120px) minmax(0, 380px) minmax(0, 1fr); gap: 16px clamp(20px, 4vw, 64px); align-items: baseline; padding: 32px 0; border-top: 2px solid var(--color-divider);\">\n      <span aria-hidden=\"true\" style=\"width: clamp(56px, 6vw, 80px); aspect-ratio: 1 / 1; align-self: start; background: var(--color-accent); color: var(--color-bg); border: 2px solid var(--color-accent); padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;\"><span style=\"font-size: 11px; font-weight: 600; line-height: 1; font-feature-settings: 'tnum' 1;\">11<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 2.6vw, 34px); line-height: 1;\">Ci<\u002Fspan><\u002Fspan>\n      <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: 0.005em; margin: 0;\">Crichton-Fock Innovation<\u002Fh3>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0; max-width: 56ch; color: var(--color-neutral-800);\">Takes methods and concepts from research to market, and holds a stake in Strange Estate – the collective that treats wine as a creative raw material.<\u002Fp>\n        <a class=\"btn btn-ghost\" href=\"https://crichtonfock.com/\" target=\"_blank\" rel=\"noopener\" style=\"padding-inline: 0;\">crichtonfock.com<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: minmax(56px, 120px) minmax(0, 380px) minmax(0, 1fr); gap: 16px clamp(20px, 4vw, 64px); align-items: baseline; padding: 32px 0; border-top: 2px solid var(--color-divider);\">\n      <span aria-hidden=\"true\" style=\"width: clamp(56px, 6vw, 80px); aspect-ratio: 1 / 1; align-self: start; background: var(--color-neutral-300); color: var(--color-text); padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;\"><span style=\"font-size: 11px; font-weight: 600; line-height: 1; font-feature-settings: 'tnum' 1;\">4<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 2.6vw, 34px); line-height: 1;\">Se<\u002Fspan><\u002Fspan>\n      <h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: 0.005em; margin: 0;\">Strange Estate <span style=\"font-weight: 600; font-size: 15px; color: var(--color-neutral-700);\">· part-owned<\u002Fspan><\u002Fh3>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0; max-width: 56ch; color: var(--color-neutral-800); Incl. Fotografiska Stockholm, Foodloopz' }], caption: 'Bottles headed for destruction are diverted to new use' },\n  { sym: 'Dg', num: 7, col: 5, row: 2, fam: 'metod', anim: 'doublegrip', name: 'Double Grip Analysis', sub: 'Science and art in one grip.', body: 'Every product is assessed on two parallel tracks: the analytical grip measures what can be found – vision, odour, taste, touch – while the analogical grip captures what the wine awakens, through metaphor, memory and gestalt. Together they reveal the critical attributes.', facts: [{ k: 'Origin', v: 'Licentiate 2004 → doctoral thesis, KTH 2011 – research since 2003' }, { k: 'Evidence', v: 'Journal of Wine Research 2024 · Frontiers in Psychology 2023' }], caption: 'The analytical and analogical grips meet in the critical attributes' },\n  { sym: 'Cm', num: 8, col: 6, row: 2, fam: 'metod', anim: 'sound', name: 'Music & Wine', sub: 'Crossmodal wine experience.', body: 'Every Strange Estate wine is made with a soundtrack in mind. Pitch and rhythm change how we perceive acidity, sweetness, body and structure – crossmodal research applied to the glass.', facts: [{ k: 'Principle', v: 'Crossmodal correspondences' }, { k: 'Research', v: 'Frontiers in Psychology 2023, with Oxford' }, { k: 'Used by', v: 'Strange Estate' }], caption: 'Pitch and rhythm shape perceived acidity, sweetness, body and structure' },\n  { sym: 'Am', num: 9, col: 7, row: 2, fam: 'produkt', anim: 'drops', name: 'Amplio Drops', sub: 'A few drops amplify your wine.', body: 'Handmade from natural flavours and ingredients gathered from Swedish seas, lakes and forests. A wine that has lost its lustre after a few days open – or an already fine wine – gains a new flavour profile in seconds.', facts: [{ k: 'Use', v: '1–3 drops in the glass, swirl, taste' }, { k: 'Ingredients', v: 'Swedish seas, lakes and forests' }, { k: 'Origin', v: 'The Återvin research project' }], link: 'https://ampliodrops.com/', linkLabel: 'ampliodrops.com', caption: '1–3 drops of Amplio change the wine’s flavour profile' },\n  { sym: 'Ah', num: 10, col: 8, row: 2, fam: 'utm', anim: 'atom', name: 'Thesis of the Year 2011', sub: 'Swedish meal literature.', body: '“Den arbetande gommen” – The Working Palate: the wine taster’s double grip. The doctoral thesis at KTH in which the Double Grip was fully defined.', facts: [{ k: 'Year', v: '2011' }, { k: 'Institution', v: 'KTH Royal Institute of Technology' }] },\n  { sym: 'Ci', num: 11, col: 1, row: 3, fam: 'bolag', anim: 'atom', name: 'Crichton-Fock Innovation', sub: 'From research to market.', body: 'Crichton-Fock Innovation develops and commercialises methods and concepts from the research, and holds a stake in Strange Estate.', facts: [{ k: 'Holdings', v: 'Stake in Strange Estate' }, { k: 'Owned by', v: 'Crichton-Fock Holding' }], link: 'https://crichtonfock.com/', linkLabel: 'crichtonfock.com' },\n  { sym: 'Uw', num: 12, col: 2, row: 3, fam: 'portfolj', anim: 'atom', name: 'Underground Wines', sub: 'Structure and balance in rescued wine.', body: 'The Strange Estate series exploring structure and balance – harmony between fruit, acidity and texture in rescued wines.', facts: [{ k: 'Range', v: 'Red · White · Rosé · Sparkling' }, { k: 'Available', v: 'Systembolaget, from SEK 38' }, { k: 'Brand of', v: 'Strange Estate' }], link: 'https://strange.estate/underground/', linkLabel: 'strange.estate' },\n  { sym: 'Åv', num: 13, col: 3, row: 3, fam: 'forskning', anim: 'blend', name: 'Återvin', sub: 'Unsellable wine, new context.', body: 'The Swedish part of Rewine The World. Wines that cannot be sold are given a new context and new flavour profiles – with ingredients such as mushrooms and flavours from sea and forest.', facts: [{ k: 'Part of', v: 'Rewine The World®' }, { k: 'First client', v: 'Fotografiska Stockholm' }], caption: 'Mushroom, sea and forest give unsellable wine a new character' },\n  { sym: 'Nm', num: 14, col: 4, row: 3, fam: 'forskning', anim: 'atom', name: 'Nature versus Machine', sub: 'Sensory evaluation of robot-cultivated food.', body: 'Multidisciplinary projects on how mechanical stress in robotic cultivation beds (LOMAS) affects the nutritional and sensory qualities of crops – meeting the cultivation of the future through its effect on culinary practice, with AI and robotics.', facts: [{ k: 'Projects', v: 'Nature vs Machine · AI & Culinary Practices · LOMAS' }, { k: 'Published', v: 'Int’l Journal of Gastronomy and Food Science 2022 · Food Chemistry 2022' }, { k: 'Research group', v: 'Sense Lab – future sensory experiences' }] },\n  { sym: 'Ft', num: 15, col: 5, row: 3, fam: 'metod', anim: 'tiers', name: '4-Tier Product Model', sub: 'Every rescued wine finds its tier.', body: 'The Double Grip Analysis ends with a decision: which tier does this material belong to? The four tiers run from the least-processed product closest to origin, to maximum extraction where nothing is wasted.', facts: [{ k: 'Tier 1 · Wine', v: 'Rescued wine, certified as a standalone product' }, { k: 'Tier 2 · Blends', v: 'Rescued materials combined into a new whole' }, { k: 'Tier 3 · New categories', v: 'Spritzers and wine coolers – cans only' }, { k: 'Tier 4 · Max extraction', v: 'Cocktails, flavourings, premium vinegar' }], link: 'https://www.upcycledby.com/#four-tier', linkLabel: 'upcycledby.com', caption: 'Four tiers – every rescued wine gets its route' },\n  { sym: 'Ca', num: 16, col: 6, row: 3, fam: 'metod', anim: 'level', name: 'Critical Attribute Technique', sub: 'Upcycling level 0–4.', body: 'The final step isolates the decisive sensory and environmental attributes – and documents the product’s upcycling level from 0 to 4, with a roadmap for blending, redistribution, repackaging or repurposing. Level 2 and above qualifies for certification.', facts: [{ k: 'Output', v: 'Upcycling level 0–4 and optimal-use profile' }, { k: 'Preceded by', v: 'Double Grip Analysis · Dialogue Consensus Technique' }], caption: 'Analytical and analogical inputs set the upcycling level' },\n n = se.caption || `Atomic model – ${se.name}`;\n    const D = (DUR[se.anim] || 6) * s;\n    const stage = h('svg', { key: this.idOf(se) + '-' + s, viewBox: '0 0 480 360', width: '100%', height: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': caption, style: { display: 'block' } }, ...ANIM[se.anim](D, se));\n\n    const legend = ['bolag', 'portfolj', 'forskning', 'metod', 'produkt', 'utm'].map(k => {\n      const f = FAM[k];\n      return lines ? { label: f.label, bg: f.bg === 'transparent' ? INK : f.bg, bd: '0px solid transparent' } : { label: f.label, bg: f.bg, bd: f.bd };\n    });\n\n    return {\n      rootRef: this.rootRef, detailRef: this.detailRef,\n      wide: !narrow,\n      gridCols: narrow ? 'repeat(3, minmax(0, 1fr))' : 'repeat(8, minmax(0, 1fr))',\n      keyCol: narrow ? '1 / -1' : '2 / 8', keyRow: narrow ? 'auto' : '1',\n      headers: HEADERS, legend, cells,\n      focus: { num: fe.num, name: fe.name, sub: fe.sub, famLabel: famLabel(fe) },\n      sel: Object.assign({}, look(se), { sym: se.sym, num: se.num, name: se.name, body: se.body, facts: se.facts, famLabel: famLabel(se), closes: CLOSES[se.sym] || 'the next way – not yet discovered.', hasLink: !!se.link, link: se.link || '#', linkLabel: se.linkLabel || '', caption }),\n      stage,\n      prev: () => this.step(-1), next: () => this.step(1)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
